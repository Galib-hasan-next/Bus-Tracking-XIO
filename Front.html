<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #007BFF;
            color: white;
            padding: 20px;
        }

        .hero {
            padding: 80px 20px;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>My Website</h1>
</header>

<div class="hero">
    <h2>Welcome!</h2>
    <p>This is a simple front page.</p>
    <button>Get Started</button>
</div>

</body>
</html>
